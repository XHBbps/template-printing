services:
  postgres:
    image: postgres:16-alpine
    mem_limit: 512m
    env_file: .env.prod
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-template_printing}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    mem_limit: 256m
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    image: ${REGISTRY:-ghcr.io/your-org}/tp-api:${TAG:-latest}
    mem_limit: 512m
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-template_printing}
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    volumes:
      - ./data/storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3000/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  web:
    image: ${REGISTRY:-ghcr.io/your-org}/tp-web:${TAG:-latest}
    mem_limit: 128m
    depends_on:
      - api
    restart: unless-stopped

  render:
    image: ${REGISTRY:-ghcr.io/your-org}/tp-render:${TAG:-latest}
    mem_limit: 2g
    env_file: .env.prod
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-template_printing}
      REDIS_URL: redis://redis:6379
      WEB_BASE: http://web:80
      STORAGE_ROOT: /storage
    volumes:
      - ./data/storage:/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    mem_limit: 128m
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./data/storage:/srv/storage:ro
      - ./data/certbot/conf:/etc/letsencrypt:ro
      - ./data/certbot/www:/var/www/certbot:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
