name: Deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '要部署的 tag (例如 v1.2.3)'
        required: true
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 飞书运维群自定义机器人 webhook(可选)。未配则通知步骤自动跳过,不影响部署。
    # 机器人安全设置建议用「自定义关键词」并加入关键词「部署」(下方文案含该词即可通过)。
    env:
      LARK_DEPLOY_WEBHOOK: ${{ secrets.LARK_DEPLOY_WEBHOOK }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/template-printing
            git fetch --tags
            ./scripts/deploy/update.sh ${{ steps.tag.outputs.tag }}

      - name: Notify Lark on success
        if: ${{ success() && env.LARK_DEPLOY_WEBHOOK != '' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="✅ [模板打印] 部署成功\n版本: ${TAG}\n仓库: ${{ github.repository }}\n触发: ${{ github.actor }}\n详情: ${RUN_URL}"
          curl -sS -X POST "$LARK_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"${text}\"}}"

      - name: Notify Lark on failure
        if: ${{ failure() && env.LARK_DEPLOY_WEBHOOK != '' }}
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          text="❌ [模板打印] 部署失败\n版本: ${TAG}\n仓库: ${{ github.repository }}\n触发: ${{ github.actor }}\n查看日志: ${RUN_URL}"
          curl -sS -X POST "$LARK_DEPLOY_WEBHOOK" \
            -H 'Content-Type: application/json' \
            -d "{\"msg_type\":\"text\",\"content\":{\"text\":\"${text}\"}}"
