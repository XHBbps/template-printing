name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push api
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tp-api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/tp-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile.prod
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tp-web:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/tp-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push render
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/render.Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/tp-render:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/tp-render:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
