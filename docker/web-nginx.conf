server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 10M;

  # API 同源反代 → api 容器。
  # 上灯塔 Pharos 后只暴露 web 一个对外端口,SPA 须同源调 /api(去掉边缘 nginx)。
  # 尾斜杠 proxy_pass 去 /api 前缀,与后端无全局前缀一致(/api/auth/... → api /auth/...)。
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
  }

  # 上传图片回显 / 渲染产物下载 —— 一律经 api 出。
  # api 的 ServeStaticModule(root=STORAGE_ROOT)提供 /uploads/*;/uploads/render/*
  # 由 SignedUploadsController 校验 HMAC token。去掉边缘 nginx 后由此 location 接管,
  # 替代原边缘 `alias /srv/storage/` 直出 —— web 镜像因此无需挂 storage 卷。
  location /uploads/ {
    proxy_pass http://api:3000/uploads/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # 构建产物长缓存(文件名含内容 hash)
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback — 其余路由回 index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
  }
}
