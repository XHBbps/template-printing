# ---- HTTP -> HTTPS redirect + ACME challenge ----
server {
  listen 80;
  server_name _;

  # Let's Encrypt webroot challenge
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  # Everything else redirects to HTTPS
  location / {
    return 301 https://$host$request_uri;
  }
}

# ---- Main HTTPS server ----
server {
  listen 443 ssl;
  http2 on;
  server_name _; # replace with actual domain in deployment

  ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:50m;

  # HSTS (enable AFTER cert verified working)
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # Prometheus 指标:仅内网 / 采集器可拉(V7)
  # allow 网段为 loopback + RFC1918 内网;运维按实际采集器 IP 调整
  location = /api/metrics {
    allow 127.0.0.1;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    deny all;
    proxy_pass http://api:3000/metrics;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # API
  location /api/ {
    proxy_pass http://api:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 10M;
    proxy_read_timeout 60s;
  }

  # Storage (uploaded images) — direct file serve from volume
  location /uploads/ {
    alias /srv/storage/;
    add_header Cache-Control "public, max-age=2592000"; # 30 days
    add_header X-Content-Type-Options nosniff;
  }

  # Web SPA — everything else goes to web container
  location / {
    proxy_pass http://web:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
